<!-- Sostituisce la sezione "Cronache" e il suo script nella home (index.html).
     Mostra gli ultimi 3 articoli dal sito stesso, senza chiamare Errante del Gusto.
     Le classi .cronache-* sono già nel CSS della home. -->
<section class="cronache-section" id="cronache">
  <div class="cronache-inner">
    <div class="section-eyebrow reveal" style="justify-content:center;">Dal Covo</div>
    <h2 class="section-title reveal">Articoli</h2>
    <p class="section-subtitle reveal">Indagini sensoriali, storie e metodo dell'aglio</p>
    <div class="cronache-grid" id="cronache-grid"></div>
    <div class="cronache-cta reveal">
      <a href="/articoli/" class="btn-secondary">Tutti gli articoli</a>
    </div>
  </div>
</section>
<script>
(function () {
  var grid = document.getElementById('cronache-grid');
  if (!grid) return;
  var esc = function (s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
  fetch('/articoli/ultimi.json')
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (posts) {
      grid.innerHTML = posts.map(function (p) {
        var img = p.immagine ? '<div class="cronache-card-img" style="background-image:url(\'' + p.immagine + '\')"></div>' : '';
        return '<a class="cronache-card visible" href="' + p.url + '">' + img +
          '<div class="cronache-card-body"><div class="cronache-card-date">' + esc(p.dataIT) + '</div>' +
          '<div class="cronache-card-title">' + esc(p.titolo) + '</div>' +
          '<p class="cronache-card-excerpt">' + esc(p.estratto) + '</p></div></a>';
      }).join('');
    })
    .catch(function () { grid.style.display = 'none'; });
})();
</script>
